[project]
name = "agent-learn"
version = "0.1.0"
description = "Agent 学习项目 - 从零到一掌握 AI Agent 开发"
requires-python = ">=3.11"
dependencies = [
    # LLM SDK
    "openai>=1.40.0",
    # 类型校验与结构化输出
    "pydantic>=2.0.0",
    # 环境变量管理
    "python-dotenv>=1.0.0",
    # HTTP 客户端
    "httpx>=0.27.0",
    # 网页搜索 (Bing 搜索 + HTML 解析)
    "beautifulsoup4>=4.12.0",
    # 向量数据库
    "chromadb>=0.5.0",
    # LangGraph 框架
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    # MCP 协议
    "mcp>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["utils"]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
